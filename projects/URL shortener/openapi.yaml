openapi: 3.0.3

info:
  title: URL Shortener API
  version: 1.0.0
  description: Simple URL shortening service

servers:
  - url: http://localhost:8080

paths:
  /shorten:
    post:
      summary: Shorten a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortenRequest'
      responses:
        '200':
          description: Short URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URL'
        '400':
          description: Invalid JSON

  /{id}:
    get:
      summary: Redirect to original URL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to original URL
        '404':
          description: Short URL not found

  /stats/{id}:
    get:
      summary: Get URL statistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URL'
        '404':
          description: Short URL not found

components:
  schemas:
    ShortenRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: https://google.com

    URL:
      type: object
      properties:
        id:
          type: string
          example: a8k2m9xz
        original_url:
          type: string
          format: uri
          example: https://google.com
        access_count:
          type: integer
          example: 5
